services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kahoot_postgres
    environment:
      POSTGRES_DB: quizapp
      POSTGRES_USER: kahoot_user
      POSTGRES_PASSWORD: kahoot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kahoot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kahoot_user -d quizapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kahoot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kahoot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  # Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kahoot_app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quizapp
      DB_USERNAME: kahoot_user
      DB_PASSWORD: kahoot_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kahoot-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kahoot-network:
    driver: bridge
