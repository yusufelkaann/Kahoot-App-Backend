spring.application.name=Kahoot_App
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (optional - for debugging)
spring.h2.console.enabled=true

# CORS / WebSocket allowed origin
app.allowed-origin=http://localhost:3000

# Redis Configuration (disabled for testing)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Spring AI (disabled for testing)
spring.ai.openai.api-key=dummy-key

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
